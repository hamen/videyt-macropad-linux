# Example key map for a "videyt" mini macropad (USB 1189:8840) — 15 keys + 2 knobs.
# Uploaded to the device with ch57x-keyboard-tool. The mapping is stored ON the
# device, so it survives reboots and works on any machine, with no daemon running.
#
# The two knobs are wired to system audio through spare keysyms + your desktop's
# keyboard shortcuts (see install.sh and README.md). The 15 keys are left as plain
# letters here — remap them to whatever you like.
#
# Validate:  ch57x-keyboard-tool validate < macropad.yaml
# Upload:    sudo ch57x-keyboard-tool upload  < macropad.yaml

orientation: normal
rows: 3
columns: 5
knobs: 2

layers:
  - buttons:
      - ["a", "b", "c", "d", "e"]
      - ["f", "g", "h", "i", "j"]
      - ["k", "l", "m", "n", "o"]
    knobs:
      # LEFT knob -> SPEAKERS
      #   turn = volume down/up, press = mute
      #   f17/f16/f18 map to spare keysyms bound to `macropad-audio spk-*`
      - ccw: "f17"    # spk-down
        press: "f16"  # spk-mute
        cw: "f18"     # spk-up
      # RIGHT knob -> MICROPHONE
      #   turn = volume down/up, press = mute
      #   f14/f15/f13 map to spare keysyms bound to `macropad-audio mic-*`
      - ccw: "f14"    # mic-down
        press: "f15"  # mic-mute
        cw: "f13"     # mic-up
