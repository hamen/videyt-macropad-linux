# Key map for a "videyt" mini macropad (USB 1189:8840) — 12 keys + 2 knobs.
# Uploaded to the device with ch57x-keyboard-tool. The mapping is stored ON the
# device, so it survives reboots and works on any machine, with no daemon running.
# The tool only WRITES — every upload replaces everything — so this file is the
# source of truth.
#
# Validate:  ch57x-keyboard-tool validate < macropad.yaml
# Upload:    sudo ch57x-keyboard-tool upload  < macropad.yaml
#
# --- Physical layout vs internal matrix ---------------------------------------
# The unit has 12 physical keys (4 rows x 3 columns) but the firmware addresses a
# 3x5 matrix (12 populated cells; the last three of row 2 are phantom). The
# physical position of a key does NOT match its (row,col) in this file — decode
# yours by flashing distinct letters and pressing keys in order (see README).
# For THIS unit the physical->cell map is:
#   physical row 1:  (0,3)  (1,2)  (2,1)
#   physical row 2:  (0,2)  (1,1)  (2,0)
#   physical row 3:  (0,1)  (1,0)  (1,4)
#   physical row 4:  (0,0)  (0,4)  (1,3)
#
# Assigned here:
#   Row 1 = dictate -> paste -> send:
#     (0,3) Pause          push-to-talk for a hold-to-talk speech-to-text
#     (1,2) Ctrl+Shift+V   paste (terminal / paste-as-plain-text)
#     (2,1) Enter          send
#   Row 2 = one-press agent macros. Each key sends a SINGLE spare keysym (never a
#     modifier chord — a chord can latch Ctrl/Alt/Shift stuck at the X level and
#     wedge your whole desktop). A shortcut runs `macropad-say` (see install.sh).
#     This machine has no touchpad, so XF86TouchpadToggle/On/Off (f21/f22/f23) are
#     inert and free; if you HAVE a touchpad, pick three other spare keysyms.
#     (0,2) f21  XF86TouchpadToggle  -> go
#     (1,1) f22  XF86TouchpadOn      -> merge
#     (2,0) f23  XF86TouchpadOff     -> stop
#   Rows 3-4 = free placeholder letters; remap as you like.
orientation: normal
rows: 3
columns: 5
knobs: 2

layers:
  - buttons:
      - ["a", "b", "f21", "<72>", "e"]
      - ["f", "f22", "ctrl-shift-v", "i", "j"]
      - ["f23", "enter", "m", "n", "o"]
    knobs:
      # LEFT knob -> SPEAKERS  (turn = volume down/up, press = mute)
      - ccw: "f17"    # spk-down
        press: "f16"  # spk-mute
        cw: "f18"     # spk-up
      # RIGHT knob -> MICROPHONE  (turn = volume down/up, press = mute)
      - ccw: "f14"    # mic-down
        press: "f15"  # mic-mute
        cw: "f13"     # mic-up
