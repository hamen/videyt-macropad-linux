# Key map for a "videyt" mini macropad (USB 1189:8840) — 12 keys + 2 knobs.
# Uploaded to the device with ch57x-keyboard-tool. The mapping is stored ON the
# device, so it survives reboots and works on any machine, with no daemon running.
# The tool only WRITES — every upload replaces everything — so this file is the
# source of truth.
#
# Validate:  ch57x-keyboard-tool validate < macropad.yaml
# Upload:    sudo ch57x-keyboard-tool upload  < macropad.yaml
#
# --- Physical layout vs internal matrix ---------------------------------------
# The unit has 12 physical keys (4 rows x 3 columns) but the firmware addresses a
# 3x5 matrix (12 populated cells; the last three of row 2 are phantom). The
# physical position of a key does NOT match its (row,col) in this file — decode
# yours by flashing distinct letters and pressing keys in order (see README).
# For THIS unit the physical->cell map is:
#   physical row 1:  (0,3)  (1,2)  (2,1)
#   physical row 2:  (0,2)  (1,1)  (2,0)
#   physical row 3:  (0,1)  (1,0)  (1,4)
#   physical row 4:  (0,0)  (0,4)  (1,3)
#
# Assigned here:
#   Row 1 = dictate -> paste -> send:
#     (0,3) Pause          push-to-talk for a hold-to-talk speech-to-text
#     (1,2) Ctrl+Shift+V   paste (terminal / paste-as-plain-text)
#     (2,1) Enter          send
#   Rows 2 and 3 = one-press agent macros. Each key sends a SINGLE spare keysym
#     (never a modifier chord — a chord can latch Ctrl/Alt/Shift stuck at the X
#     level and wedge your whole desktop). A shortcut runs `macropad-say` (see
#     install.sh). This machine has no touchpad, so XF86TouchpadToggle/On/Off
#     (f21/f22/f23) are inert and free; if you HAVE a touchpad, pick other spare
#     keysyms for those three.
#     (0,2) f21    XF86TouchpadToggle  -> go
#     (1,1) f22    XF86TouchpadOn      -> merge
#     (2,0) f23    XF86TouchpadOff     -> stop
#     (0,1) favorites  XF86Favorites     -> round   (physical row 3, col 1)
#     (1,0) calculator XF86Calculator    -> compact (physical row 3, col 2)
#     PICKING A KEYSYM — the rule that cost a merged-and-broken key: the name has
#     to be one your DESKTOP can parse, not merely a keysym that exists in the X
#     keymap. XFCE resolves a shortcut name through GTK, so if
#     Gdk.keyval_from_name(name) returns VoidSymbol, xfsettingsd silently never
#     installs the grab: the shortcut sits in xfconf looking correct and the key
#     does nothing, with no error anywhere. The first version of this key used
#     the raw HID code <118> (KEY_PROPS -> keysym SunProps). The pad emitted it
#     and X delivered it, but GTK does not know the name "SunProps", so it never
#     worked. tests/keysym-names.test.sh now guards this.
#     f13-f24 were already spent: f13-f18 drive the knobs, f21-f23 the three keys
#     above, f20 is XF86AudioMicMute (a global handler eats it), f19/f24 have no
#     keysym at all. `favorites` is a NAMED media key in ch57x-keyboard-tool, and
#     XF86Favorites is a name GTK knows. `calculator` is the other named media
#     key that is safe here: Linux maps it to KEY_CALC, X to XF86Calculator
#     (keycode 148), and GTK knows that name too. (`screenlock` would lock the
#     session; the rest are volume/playback keys a global handler already owns.)
#   Row 3 col 3 = free placeholder letter; remap as you like.
#   Row 4 (physical) = utility row:
#     (0,0) physical row 4 col 1: Shift+PrintScreen -> selection screenshot
#     (0,4) physical row 4 col 2: Ctrl+V             -> paste
#     (1,3) physical row 4 col 3: Enter              -> send
orientation: normal
rows: 3
columns: 5
knobs: 2

layers:
  - buttons:
      - ["shift-printscreen", "favorites", "f21", "<72>", "ctrl-v"]
      - ["calculator", "f22", "ctrl-shift-v", "enter", "j"]
      - ["f23", "enter", "m", "n", "o"]
    knobs:
      # LEFT knob -> SPEAKERS  (turn = volume down/up, press = mute)
      - ccw: "f17"    # spk-down
        press: "f16"  # spk-mute
        cw: "f18"     # spk-up
      # RIGHT knob -> MICROPHONE  (turn = volume down/up, press = mute)
      - ccw: "f14"    # mic-down
        press: "f15"  # mic-mute
        cw: "f13"     # mic-up
